name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      codex_contract:
        description: Run real Codex contract tests (requires CODEX_AUTH_JSON secret)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI installs every tool a suite declares, so a missing tool fails the suite instead of skipping it.
env:
  CODEX_LSP_REQUIRE_TOOLS: "1"

jobs:
  test:
    name: test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node ${{ matrix.node }}
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      # bash and zsh integration applies to Linux and macOS; PowerShell integration runs everywhere.
      - name: Record shell versions
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then bash --version | head -n 1; zsh --version; fi
          pwsh --version

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      # Reuses the build above: the suites rebuild only when dist does not match the sources.
      - name: Default tests (logic and components)
        run: pnpm run test

      - name: Platform tests (shells, file watching, signals, process trees)
        run: pnpm run test:platform

      # The packaging script checks that dist was built from these sources instead of rebuilding.
      - name: Plugin package
        run: node scripts/package-plugin.mjs --verify

      - name: Package file list
        run: pnpm pack --dry-run

  integration:
    name: integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: python
            files: test/integration/python.test.ts
          - suite: typescript
            files: test/integration/typescript.test.ts test/integration/typescript7.test.ts
          - suite: go
            files: test/integration/go.test.ts
          - suite: rust
            files: test/integration/rust.test.ts
          - suite: cpp
            files: test/integration/cpp.test.ts
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile

      - name: Install Python tools
        if: matrix.suite == 'python'
        run: |
          npm install -g pyright@1.1.414
          pipx install ruff==0.17.0
          pipx install uv==0.13.1
      # Conda itself only; the tests create their own temporary environments from conda-forge.
      - name: Install Conda
        if: matrix.suite == 'python'
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: "false"
          run-init: "false"
      - name: Install TypeScript 6 language server
        if: matrix.suite == 'typescript'
        run: npm install -g typescript-language-server@6.0.0
      - name: Install gopls
        if: matrix.suite == 'go'
        run: |
          go install golang.org/x/tools/gopls@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install rust-analyzer
        if: matrix.suite == 'rust'
        run: rustup component add rust-analyzer
      - name: Install clangd
        if: matrix.suite == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y clangd

      - name: Record tool versions
        run: |
          case "${{ matrix.suite }}" in
            python) python3 --version; pyright --version; ruff --version; uv --version; conda --version ;;
            typescript) typescript-language-server --version; node node_modules/typescript/bin/tsc --version ;;
            go) go version; gopls version ;;
            rust) rustup --version; rustc --version; cargo --version; rust-analyzer --version ;;
            cpp) clangd --version ;;
          esac

      - name: Integration tests
        run: pnpm run test:integration ${{ matrix.files }}

  codex-contract:
    name: contract (Codex 0.163.0)
    if: github.event_name == 'workflow_dispatch' && inputs.codex_contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @openai/codex@0.163.0 pyright@1.1.414
      - run: pnpm run test:package
      - name: Write isolated authentication file
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          const auth = process.env.CODEX_AUTH_JSON;
          if (!auth) throw new Error("CODEX_AUTH_JSON secret is required for contract tests");
          JSON.parse(auth);
          writeFileSync(join(process.env.RUNNER_TEMP, "codex-lsp-auth.json"), auth, { mode: 0o600 });
          NODE
      - name: Codex contract
        env:
          CODEX_LSP_CONTRACT_AUTH: ${{ runner.temp }}/codex-lsp-auth.json
        run: pnpm run test:contract
      - name: Remove authentication file
        if: always()
        run: rm -f "$RUNNER_TEMP/codex-lsp-auth.json"
