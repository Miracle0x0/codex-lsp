name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm and Node 24
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:all

      - name: Check
        run: pnpm run check:all

      - name: Unit tests
        run: pnpm run test:all

      - name: Plugin package
        run: pnpm run test:package

      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN is not configured; refusing to report a successful release." >&2
            exit 1
          fi
          runtime_version=$(node -p "require('./packages/lsp-tools-mcp/package.json').version")
          if ! pnpm view "@code-yeongyu/lsp-tools-mcp@${runtime_version}" version >/dev/null 2>&1; then
            echo "@code-yeongyu/lsp-tools-mcp@${runtime_version} is not published; publish the runtime first." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
